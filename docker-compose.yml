services:
  postgres:
    image: postgres:16-alpine
    container_name: protopen-postgres
    environment:
      POSTGRES_DB: protopen
      POSTGRES_USER: protopen
      POSTGRES_PASSWORD: protopen
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - protopen_postgres_data:/var/lib/postgresql/data

volumes:
  protopen_postgres_data:
