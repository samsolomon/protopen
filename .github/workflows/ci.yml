name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: protopen
          POSTGRES_PASSWORD: protopen
          POSTGRES_DB: protopen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U protopen"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Stub embedded frontend
        # api/frontend.go has //go:embed all:dist; the real dist is built by
        # the `web` job. CI doesn't need the real frontend bytes to validate
        # Go code — a stub placeholder is enough for the embed to resolve.
        run: mkdir -p api/dist && touch api/dist/.gitkeep
      - name: Build
        run: (cd api && go build ./...)
      - name: Test
        # TEST_DATABASE_URL opts the database-backed tests in (dbtest_test.go
        # skips them when it is unset).
        env:
          TEST_DATABASE_URL: postgres://protopen:protopen@localhost:5432/protopen_test
        run: (cd api && go test ./...)

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build
        run: (cd cli && go build ./...)
      - name: Test
        run: (cd cli && go test ./...)

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Type check
        run: (cd web && npx tsc --noEmit)
      - name: Test
        run: (cd web && npm test -- --run)
      - name: Build
        run: npm run build:web
