{{define "title"}}Reset your Velori password{{end}}
{{template "base" .}}
{{define "content"}}
<p style="margin:0 0 16px;font-size:15px;color:#18181b;line-height:1.5;">You requested a password reset for your Velori account.</p>
<p style="margin:0 0 24px;font-size:15px;color:#3f3f46;line-height:1.5;">Click below to set a new password.</p>
<a href="{{.ResetURL}}" style="display:inline-block;padding:10px 24px;background-color:#18181b;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;border-radius:8px;">Reset password</a>
<p style="margin:24px 0 0;font-size:13px;color:#a1a1aa;line-height:1.5;">This link expires in 1 hour. If you didn't request this, you can ignore this email.</p>
{{end}}
