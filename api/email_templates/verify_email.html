{{define "title"}}Verify your Velori account{{end}}
{{template "base" .}}
{{define "content"}}
<p style="margin:0 0 16px;font-size:15px;color:#18181b;line-height:1.5;">Hi {{.Name}},</p>
<p style="margin:0 0 24px;font-size:15px;color:#3f3f46;line-height:1.5;">Verify your email to get started with Velori.</p>
<a href="{{.VerifyURL}}" style="display:inline-block;padding:10px 24px;background-color:#18181b;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;border-radius:8px;">Verify email</a>
<p style="margin:24px 0 0;font-size:13px;color:#a1a1aa;line-height:1.5;">This link expires in 24 hours.</p>
{{end}}
